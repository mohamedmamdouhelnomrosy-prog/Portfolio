<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Mohamed Mamdouh El Nomrosy , Software Testing Engineer has Experience 3 years In Testing Apps  ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mohamed El Nomrosy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Mohamed El Nomrosy</title>
  <link rel="manifest" href="manifest.json">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    // ─── Theme detection: runs before any paint, no flash ───────────────
    // Mirrors ThemeCubit.getCurrentTheme() exactly:
    // SharedPref.getTheme() returns a bool (stored via shared_preferences_web
    // as the literal string "true"/"false" under key "flutter.theme"),
    // and defaults to false (light) when nothing is saved yet — NOT the
    // device's prefers-color-scheme. Splash must match this or the app
    // will visibly flip themes the instant Flutter takes over.
    (function () {
      var raw = null;
      try {
        raw = localStorage.getItem('flutter.theme');
      } catch (e) {
        // localStorage may be unavailable (private mode, etc.)
      }

      var isDark = raw === 'true'; // null or 'false' => light, matching ThemeState.init()
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    })();
  </script>

  <style>
    :root{
      /* dark theme (default) */
      --background:#0F2542;
      --surface:#0c1b2d;
      --accent:#6FB6E8;
      --accent-soft:#02111f;
      --secondary:#BE8A54;
      --secondary-soft:#3A2A12;
      --text1:#EAF2FB;
      --text3:#7C93AC;
    }

    html[data-theme="light"]{
      --background:#F4F7FB;
      --surface:#FFFFFF;
      --accent:#2C74A6;
      --accent-soft:#E3F0FA;
      --secondary:#8C5C2E;
      --secondary-soft:#FBF0DE;
      --text1:#10233A;
      --text3:#6D7C90;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--background);
      overflow: hidden;
    }

    body {
      min-height: 100vh;
    }

    flt-glass-pane {
      background-color: var(--background) !important;
    }

    /* ─── Splash ─────────────────────────────────────────────────────── */
    #splash{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:var(--background);
      font-family:'Inter', sans-serif;
      z-index:9999;
      transition:opacity .4s ease;
    }

    #splash.hide{
      opacity:0;
      pointer-events:none;
    }

    /* photo + rotating ring loader */
    #avatar-wrap{
      position:relative;
      width:132px;
      height:132px;
      margin-bottom:28px;
    }

    #avatar-wrap img{
      position:absolute;
      inset:10px;
      width:112px;
      height:112px;
      border-radius:50%;
      object-fit:cover;
      background:var(--surface);
      box-shadow:0 0 0 1px var(--accent-soft);
    }

    #ring{
      position:absolute;
      inset:0;
      width:132px;
      height:132px;
      animation:spin 1.6s linear infinite;
    }

    #ring circle{
      fill:none;
      stroke:var(--accent);
      stroke-width:2.5;
      stroke-linecap:round;
      stroke-dasharray:70 190;
    }

    @keyframes spin{
      to{ transform:rotate(360deg); }
    }

    #progress-row{
      display:flex;
      align-items:center;
      gap:12px;
    }

    #track{
      width:140px;
      height:3px;
      border-radius:2px;
      background:var(--accent-soft);
      position:relative;
      overflow:hidden;
    }

    #fill{
      position:absolute;
      inset:0;
      width:0%;
      background:var(--accent);
      border-radius:2px;
      transition:width .25s ease;
    }

    #percent{
      font-size:12px;
      font-weight:500;
      color:var(--text3);
      min-width:32px;
      text-align:right;
      font-variant-numeric:tabular-nums;
    }

    @media (prefers-reduced-motion: reduce){
      #ring{ animation:none; }
    }
  </style>
</head>

<body>

<div id="splash">
  <div id="avatar-wrap">
    <img src="splash-avatar.png" alt="">
    <svg id="ring" viewBox="0 0 132 132" xmlns="http://www.w3.org/2000/svg">
      <circle cx="66" cy="66" r="63" />
    </svg>
  </div>

  <div id="progress-row">
    <div id="track"><div id="fill"></div></div>
    <div id="percent">0%</div>
  </div>
</div>

<script>
  // called from Dart once PortfolioCubit reaches success or error
  function hideSplash() {
    var splash = document.getElementById('splash');
    if (!splash) return;

    var fill = document.getElementById('fill');
    var percent = document.getElementById('percent');
    if (fill) fill.style.width = '100%';
    if (percent) percent.textContent = '100%';

    setTimeout(function () {
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 500);
    }, 150);
  }
  window.hideSplash = hideSplash;

  // cosmetic progress fill while real data loads — purely visual, not tied to actual bytes
  (function () {
    var p = 0;
    var fill = document.getElementById('fill');
    var percent = document.getElementById('percent');
    var timer = setInterval(function () {
      p += Math.random() * 6;
      if (p >= 92) { p = 92; clearInterval(timer); } // hold near-full until hideSplash() fires
      fill.style.width = p + '%';
      percent.textContent = Math.floor(p) + '%';
    }, 200);
  })();
</script>

<script src="flutter_bootstrap.js" defer></script>

</body>
</html>
